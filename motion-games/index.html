<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>우리집 모션 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#3d9bff; --p2:#ff8a3d;
  --ink:#1f2340; --paper:#fffaf0; --accent:#ffcf3d; --good:#2ecc71; --bad:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#1b1e3a;color:var(--ink);
  font-family:'Jua',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;touch-action:manipulation}
#video{position:fixed;opacity:0;pointer-events:none;width:2px;height:2px;left:0;top:0}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto}
.hidden{display:none!important}
.panel{background:rgba(255,250,240,.94);border-radius:28px;padding:24px 28px;max-width:1000px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}
h1{font-size:clamp(30px,5vw,48px);text-align:center;letter-spacing:-1px}
h1 span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.sub{text-align:center;color:#6a6f8f;font-size:18px;margin-top:4px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:18px}
.who{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 14px;border:4px solid var(--c);min-width:0}
.who .dot{width:22px;height:22px;border-radius:50%;background:var(--c);flex:none}
.who input{font:inherit;font-size:22px;border:none;outline:none;width:7em;max-width:40vw;background:transparent;color:var(--ink)}
.who .seen{font-size:16px;color:#888;white-space:nowrap}
.seg{display:flex;background:#ece6d8;border-radius:16px;padding:4px}
.seg button{font:inherit;font-size:18px;border:none;background:transparent;padding:8px 14px;border-radius:12px;color:#555;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.lbl{font-size:18px;color:#6a6f8f}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
@media (max-width:820px){.games{grid-template-columns:repeat(2,1fr)}}
.card{font:inherit;border:none;cursor:pointer;border-radius:22px;padding:18px 10px 16px;color:#fff;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.card .em{font-size:56px;line-height:1.1;display:block}
.card .t{font-size:28px;display:block;margin-top:6px}
.card .d{font-size:16px;opacity:.92;display:block;margin-top:4px}
.btn{font:inherit;font-size:22px;border:none;border-radius:18px;padding:12px 22px;cursor:pointer;background:var(--accent);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#ece6d8}
.status{text-align:center;margin-top:14px;font-size:18px;color:#6a6f8f;min-height:1.4em}
.tip{margin-top:16px;background:#f3eddd;border-radius:16px;padding:12px 16px;font-size:16px;color:#5b5f7c;line-height:1.5}
#quit{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;
  font:inherit;font-size:18px;border:none;border-radius:999px;padding:8px 16px;background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(27,30,58,.85);color:#fff;font-size:26px;z-index:20;text-align:center;padding:16px}
.spin{width:64px;height:64px;border-radius:50%;border:8px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res-title{font-size:clamp(34px,6vw,60px);text-align:center}
.res-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.res-card{border-radius:22px;padding:18px;text-align:center;color:#fff;position:relative}
.res-card .n{font-size:30px}
.res-card .s{font-size:clamp(44px,8vw,72px);line-height:1.1}
.res-card .x{font-size:18px;opacity:.95}
.res-card .crown{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:52px;animation:bob 1.2s ease-in-out infinite}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="cv"></canvas>

<div id="menu" class="screen">
  <div class="panel">
    <h1><span>🤸</span> 우리집 모션 게임 <span>🎮</span></h1>
    <p class="sub">아이패드 카메라 앞에서 몸으로 하는 2인용 게임</p>

    <div class="row">
      <label class="who" style="--c:var(--p1)"><span class="dot"></span><input id="n1" maxlength="8" value="아빠" aria-label="왼쪽 플레이어 이름"><span class="seen" id="seen1">왼쪽</span></label>
      <label class="who" style="--c:var(--p2)"><span class="dot"></span><input id="n2" maxlength="8" value="아들" aria-label="오른쪽 플레이어 이름"><span class="seen" id="seen2">오른쪽</span></label>
    </div>

    <div class="row">
      <span class="lbl">인식 감도</span>
      <div class="seg" id="sens">
        <button data-v="easy">쉬움</button><button data-v="normal">보통</button><button data-v="hard">어려움</button>
      </div>
      <span class="lbl">조작</span>
      <div class="seg" id="mode">
        <button data-v="cam">📷 카메라</button><button data-v="touch">👆 터치</button>
      </div>
    </div>

    <div class="games" id="games"></div>

    <div class="row">
      <button class="btn" id="camBtn">📷 카메라 켜고 자리 확인하기</button>
    </div>
    <div class="status" id="status"></div>

    <div class="tip">
      💡 아이패드를 <b>가로</b>로 세워 두고 <b>2~3걸음</b> 뒤로 가서 나란히 서세요. 화면 <b>왼쪽</b>에 서는 사람이 파란색, <b>오른쪽</b>이 주황색이에요.
      머리부터 무릎까지 보이면 가장 잘 돼요. 잘 안 잡히면 감도를 <b>쉬움</b>으로 바꿔 보세요.
    </div>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="panel">
    <div class="res-title" id="resTitle"></div>
    <div class="res-cards" id="resCards"></div>
    <div class="row" style="margin-top:24px">
      <button class="btn" id="againBtn">🔁 한 판 더!</button>
      <button class="btn ghost" id="menuBtn">🏠 다른 게임</button>
    </div>
  </div>
</div>

<button id="quit" class="hidden">✕ 그만하기</button>
<div id="loading" class="hidden"><div class="spin"></div><div id="loadingText">불러오는 중...</div></div>

<script type="module">
// ---------------------------------------------------------------------------
// 설정
// ---------------------------------------------------------------------------
const MP_VER = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`;
const MP_WASM = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

// jump: 몸이 올라가야 하는 높이(몸통 길이 대비), move: '얼음'에서 허용되는 움직임
const SENS = {
  easy:   { jump: 0.07, knee: 0.12, move: 0.95 },
  normal: { jump: 0.11, knee: 0.17, move: 0.65 },
  hard:   { jump: 0.16, knee: 0.24, move: 0.45 },
};

const $ = s => document.querySelector(s);
const video = $('#video'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const store = {
  get(k, d) { try { const v = localStorage.getItem('mg_' + k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mg_' + k, v); } catch {} },
};
const settings = { sens: store.get('sens', 'normal'), mode: store.get('mode', 'cam') };
const sens = () => SENS[settings.sens] || SENS.normal;
const touchMode = () => settings.mode === 'touch';

// ---------------------------------------------------------------------------
// 소리
// ---------------------------------------------------------------------------
let ac = null;
function audio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch {}
  return ac;
}
function tone(f, d = 0.12, type = 'sine', v = 0.18, slide = 0, delay = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const SFX = {
  good()  { tone(660, .08, 'square', .09); tone(990, .1, 'square', .09, 0, .07); },
  bad()   { tone(220, .3, 'sawtooth', .1, -120); },
  pop()   { tone(500 + Math.random() * 300, .09, 'triangle', .2, 500); },
  gold()  { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .1, 'square', .08, 0, i * .06)); },
  step(i) { tone(i % 2 ? 300 : 360, .05, 'triangle', .12); },
  whoosh(){ tone(900, .12, 'sine', .05, -600); },
  count() { tone(523, .15, 'square', .1); },
  go()    { tone(1046, .35, 'square', .12); },
  win()   { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, .16, 'square', .1, 0, i * .12)); },
  note(f) { tone(f, .18, 'triangle', .12); },
};
function say(txt) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ko-KR'; u.rate = 1.05; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch {}
}

// ---------------------------------------------------------------------------
// 플레이어 & 동작 인식
// ---------------------------------------------------------------------------
function makePlayer(i) {
  return { i, color: i ? '#ff8a3d' : '#3d9bff', name: i ? '아들' : '아빠',
    lm: null, seenAt: -9, prevT: 0, torso: null, base: null, rise: 0,
    air: false, lastAirT: -9, kneeUp: [false, false], lastLeg: 0, kneesSeenAt: -9, bounceUp: false,
    lastStepT: -9, motion: 0, prevPts: null, hands: [], shake: 0, airFx: 0,
    score: 0, combo: 0, best: 0, pos: 0, speed: 0, steps: 0, finishT: null, caught: false };
}
const players = [makePlayer(0), makePlayer(1)];

let landmarker = null, camReady = false, lastVideoTime = -1;
const vmap = { ox: 0, oy: 0, dw: 1, dh: 1 };
function updateVideoMap() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh);
  vmap.dw = vw * s; vmap.dh = vh * s; vmap.ox = (W - vmap.dw) / 2; vmap.oy = (H - vmap.dh) / 2;
}
// 거울 모드: 화면 왼쪽에 보이는 사람 = 왼쪽 플레이어
const toX = x => vmap.ox + (1 - x) * vmap.dw;
const toY = y => vmap.oy + y * vmap.dh;

function processPoses(list, t) {
  updateVideoMap();
  const cand = list.map(lms => {
    const pts = lms.map(l => ({ x: toX(l.x), y: toY(l.y), v: l.visibility ?? 1 }));
    return { pts, cx: (pts[11].x + pts[12].x) / 2 };
  }).sort((a, b) => a.cx - b.cx);
  const assign = [null, null];
  if (cand.length >= 2) { assign[0] = cand[0]; assign[1] = cand[cand.length - 1]; }
  else if (cand.length === 1) assign[cand[0].cx < W / 2 ? 0 : 1] = cand[0];
  players.forEach((p, i) => {
    if (assign[i]) updatePlayer(p, assign[i].pts, t);
    else if (t - p.seenAt > 0.6) { p.lm = null; p.prevPts = null; p.hands = []; p.base = null; }
  });
}

function updatePlayer(p, pts, t) {
  const dt = p.prevT ? Math.min(0.2, Math.max(0.001, t - p.prevT)) : 0.033;
  p.prevT = t; p.lm = pts; p.seenAt = t;
  const vis = k => pts[k].v > 0.4;
  const S = sens();
  const sh = { x: (pts[11].x + pts[12].x) / 2, y: (pts[11].y + pts[12].y) / 2 };
  const hipsOk = vis(23) && vis(24);
  const hip = { x: (pts[23].x + pts[24].x) / 2, y: (pts[23].y + pts[24].y) / 2 };
  let torso = hipsOk ? Math.hypot(hip.x - sh.x, hip.y - sh.y)
                     : Math.hypot(pts[11].x - pts[12].x, pts[11].y - pts[12].y) * 1.3;
  torso = Math.max(torso, 20);
  p.torso = p.torso ? p.torso + (torso - p.torso) * 0.1 : torso;

  // --- 점프: 어깨 높이가 평소 위치보다 올라갔는지
  const bodyY = sh.y;
  if (p.base == null) p.base = bodyY;
  const rise = (p.base - bodyY) / p.torso;
  p.rise = rise;
  if (rise > S.jump) {
    if (!p.air) { p.air = true; p.airFx = 1; onJump(p, t); }
    p.lastAirT = t;
  } else if (rise < S.jump * 0.5) p.air = false;
  // 기준선: 내려갈 때는 빨리, 올라갈 때는 천천히 따라감
  const rate = bodyY > p.base ? 8 : (p.air ? 0.15 : 1.0);
  p.base += (bodyY - p.base) * (1 - Math.exp(-dt * rate));

  // --- 제자리 달리기: 무릎을 번갈아 들기 (무릎이 안 보이면 몸 들썩임으로)
  if (vis(25) && vis(26)) {
    p.kneesSeenAt = t;
    for (let leg = 0; leg < 2; leg++) {
      const k = pts[25 + leg], o = pts[26 - leg];
      const lift = (o.y - k.y) / p.torso;
      if (!p.kneeUp[leg] && lift > S.knee) {
        p.kneeUp[leg] = true;
        if (p.lastLeg !== leg + 1) { p.lastLeg = leg + 1; doStep(p, t); }
      } else if (p.kneeUp[leg] && lift < S.knee * 0.4) p.kneeUp[leg] = false;
    }
  }
  if (t - p.kneesSeenAt > 1) {
    if (!p.bounceUp && rise > S.jump * 0.45) { p.bounceUp = true; doStep(p, t); }
    else if (p.bounceUp && rise < S.jump * 0.15) p.bounceUp = false;
  }

  // --- 움직임 양 (얼음 게임)
  const KEY = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26];
  if (p.prevPts) {
    let sum = 0, n = 0;
    for (const k of KEY) if (pts[k].v > 0.5 && p.prevPts[k].v > 0.5) {
      sum += Math.hypot(pts[k].x - p.prevPts[k].x, pts[k].y - p.prevPts[k].y); n++;
    }
    const m = n ? sum / n / p.torso / dt : 0;
    p.motion += (Math.min(m, 6) - p.motion) * (1 - Math.exp(-dt * 6));
  }
  p.prevPts = pts;

  // --- 손 위치 (손목에서 팔 방향으로 조금 연장)
  p.hands = [];
  for (const [w, e] of [[15, 13], [16, 14]]) {
    if (pts[w].v > 0.3) p.hands.push({ x: pts[w].x + (pts[w].x - pts[e].x) * 0.3, y: pts[w].y + (pts[w].y - pts[e].y) * 0.3 });
  }
}

function doStep(p, t) {
  if (t - p.lastStepT < 0.13) return;
  p.lastStepT = t;
  if (game && game.onStep) game.onStep(p, t, phase === 'play');
}
function onJump(p, t) { if (game && game.onJump) game.onJump(p, t, phase === 'play'); }

// ---------------------------------------------------------------------------
// 카메라 & 모델
// ---------------------------------------------------------------------------
function showLoading(txt) { $('#loadingText').textContent = txt; $('#loading').classList.remove('hidden'); }
function hideLoading() { $('#loading').classList.add('hidden'); }

let camPromise = null;
function startCamera() {
  if (!camPromise) camPromise = (async () => {
    showLoading('카메라를 켜는 중... 📷');
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('이 브라우저는 카메라를 지원하지 않아요. 사파리로 https 주소에서 열어 주세요.');
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
      video.srcObject = stream;
      await video.play().catch(() => {});
      showLoading('몸 인식 인공지능을 불러오는 중... 🤖\n(처음 한 번은 조금 걸려요)');
      const { PoseLandmarker, FilesetResolver } = await import(MP_URL);
      const fileset = await FilesetResolver.forVisionTasks(MP_WASM);
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL_URL, delegate: d }, runningMode: 'VIDEO',
        numPoses: 2, minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
      try { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('GPU')); }
      catch { landmarker = await PoseLandmarker.createFromOptions(fileset, opts('CPU')); }
      camReady = true;
      hideLoading();
      return true;
    } catch (e) {
      hideLoading();
      camPromise = null;
      console.error(e);
      const msg = e && e.name === 'NotAllowedError'
        ? '카메라 사용이 거부됐어요. 설정 > Safari > 카메라 에서 허용해 주세요.'
        : (e && e.message) || '카메라를 켜지 못했어요.';
      setStatus('⚠️ ' + msg + ' 지금은 "👆 터치" 모드로 할 수 있어요.');
      return false;
    }
  })();
  return camPromise;
}

function detect(t) {
  if (!camReady || !landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  try {
    const res = landmarker.detectForVideo(video, performance.now());
    processPoses(res.landmarks || [], t);
  } catch (e) { console.warn(e); }
}

// ---------------------------------------------------------------------------
// 효과
// ---------------------------------------------------------------------------
const fx = [], parts = [];
function floatText(x, y, txt, color = '#fff', size = 44) { fx.push({ x, y, txt, color, size, t: 0, life: 1.1 }); }
function burst(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 280;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, c: color, t: 0, life: .6 + Math.random() * .4, r: 4 + Math.random() * 6 });
  }
}
function drawFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.t += dt; if (q.t > q.life) { parts.splice(i, 1); continue; }
    q.vy += 600 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; if (f.t > f.life) { fx.splice(i, 1); continue; }

  init() { this.theta = 0; this.pending = []; this.elapsed = 0;

  period() { return Math.max(0.85, 1.55 - this.elapsed * 0.012); },

      const hue = (t * 120) % 360;
      text('춤춰요! 💃🕺', W / 2, H * 0.2 + Math.sin(t * 8) * 8, Math.min(100, W * 0.09), `hsl(${hue},90%,70%)`);
      for (let k = 0; k < 2; k++) text('🎵', (k ? .85 : .15) * W, H * .3 + Math.sin(t * 5 + k * 2) * 20, 50, '#fff', 'center', false);
    }
    text(`${this.round + 1} / ${this.rounds} 라운드`, W / 2, H - 40, 28, '#fff');
  },
  label(p) { return `❄️ ${p.score}번`; },
  result() { return players.map(p => ({ main: `${p.score}번`, sub: `${this.rounds}라운드 중 멈추기 성공`, v: p.score })); },
};

const GAMES = [JumpRope, Race, Balloons, Freeze];

// ---------------------------------------------------------------------------
// 진행
// ---------------------------------------------------------------------------
let game = null, phase = 'menu', phaseT = 0, timeLeft = 0, countN = 0;

async function startGame(g) {
  audio();
  players[0].name = $('#n1').value.trim() || '왼쪽';
  players[1].name = $('#n2').value.trim() || '오른쪽';
  if (!touchMode()) {
    const ok = await startCamera();
    if (!ok) return;
  }
  game = g; game.init();
  fx.length = 0; parts.length = 0;
  timeLeft = g.duration || 0;
  $('#menu').classList.add('hidden'); $('#result').classList.add('hidden'); $('#quit').classList.remove('hidden');
  phase = 'countdown'; phaseT = 0; countN = 3; SFX.count(); say('준비');
}
function endGame() {
  phase = 'result';
  $('#quit').classList.add('hidden');
  const r = game.result();
  const winner = r[0].v === r[1].v ? -1 : (r[0].v > r[1].v ? 0 : 1);
  $('#resTitle').textContent = winner < 0 ? '🤝 무승부! 둘 다 최고!' : `🏆 ${players[winner].name} 승리!`;
  $('#resCards').innerHTML = '';
  r.forEach((x, i) => {
    const d = document.createElement('div'); d.className = 'res-card'; d.style.background = players[i].color;
    d.innerHTML = (winner === i ? '<div class="crown">👑</div>' : '') +
      `<div class="n"></div><div class="s"></div><div class="x"></div>`;
    d.querySelector('.n').textContent = players[i].name;
    d.querySelector('.s').textContent = x.main;
    d.querySelector('.x').textContent = x.sub;
    $('#resCards').appendChild(d);
  });
  $('#result').classList.remove('hidden');
  SFX.win();
  say(winner < 0 ? '무승부! 둘 다 최고!' : `${players[winner].name} 승리!`);
}
function toMenu() {
  phase = 'menu'; game = null;
  $('#result').classList.add('hidden'); $('#quit').classList.add('hidden'); $('#menu').classList.remove('hidden');
}

let lastT = performance.now() / 1000;
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now() / 1000, rawDt = Math.min(0.5, t - lastT), dt = Math.min(0.05, rawDt); lastT = t;
  detect(t);
  players.forEach(p => { p.shake = Math.max(0, p.shake - dt); p.airFx = Math.max(0, p.airFx - dt * 2.5); });

  ctx.clearRect(0, 0, W, H);
  drawBackground();
  players.forEach(drawSkeleton);

  if (game && (phase === 'countdown' || phase === 'play')) {
    if (phase === 'countdown') {
      phaseT += rawDt;
      game.update(dt, t, false);
      if (phaseT >= 1) { phaseT -= 1; countN--; if (countN > 0) SFX.count(); else { SFX.go(); say('시작!'); phase = 'play'; } }
    } else {
      game.update(dt, t, true);
      if (game.duration) {
        timeLeft -= rawDt;
        if (timeLeft <= 0 || (game.isOver && game.isOver())) { timeLeft = 0; endGame(); }
      } else if (game.isOver && game.isOver()) endGame();
    }
    game.draw(t);
    drawScoreBoxes(p => game.label(p));
    if (phase === 'countdown') text(countN > 0 ? String(countN) : '시작!', W / 2, H / 2, Math.min(200, H * .3), '#ffd84d');
    else if (phaseT < 0.8 && countN <= 0) { phaseT += dt; text('시작!', W / 2, H / 2, Math.min(200, H * .3), '#ffd84d'); }
    if (phase === 'play' && game.duration && !game.countUp) {
      const s = Math.ceil(timeLeft);
      text(`⏱ ${s}`, W / 2, 80, 44, s <= 5 ? '#ff6b81' : '#fff');
    } else if (phase === 'play' && game.countUp) {
      text(`⏱ ${game.elapsed.toFixed(1)}초`, W / 2, 80, 40, '#fff');
    }
    if (touchMode()) text('👆 내 쪽 화면을 톡톡!', W / 2, H - 16 - (game.id === 'freeze' ? 50 : 0) - (game.id === 'race' ? Math.max(150, H * .3) : 0), 22, 'rgba(255,255,255,.9)');
  } else if (phase === 'menu') {
    menuStatusTick(t);
  }
  drawFx(dt);
}
requestAnimationFrame(loop);

// 터치 입력
cv.addEventListener('pointerdown', e => {
  if (!game || phase !== 'play' || !touchMode()) return;
  const p = players[e.clientX < W / 2 ? 0 : 1];
  game.onTap && game.onTap(p, e.clientX, e.clientY, performance.now() / 1000);
});

// ---------------------------------------------------------------------------
// 메뉴 UI
// ---------------------------------------------------------------------------
function setStatus(s) { $('#status').textContent = s; }
let lastMenuTick = 0;
function menuStatusTick(t) {
  if (t - lastMenuTick < 0.3) return; lastMenuTick = t;
  if (touchMode()) { $('#seen1').textContent = '왼쪽'; $('#seen2').textContent = '오른쪽'; return; }
  if (!camReady) return;
  $('#seen1').textContent = players[0].lm ? '✅ 보여요' : '👀 왼쪽에 서요';
  $('#seen2').textContent = players[1].lm ? '✅ 보여요' : '👀 오른쪽에 서요';
}

const gamesEl = $('#games');
GAMES.forEach(g => {
  const b = document.createElement('button');
  b.className = 'card'; b.style.background = g.color;
  b.innerHTML = `<span class="em"></span><span class="t"></span><span class="d"></span>`;
  b.querySelector('.em').textContent = g.emoji;
  b.querySelector('.t').textContent = g.title;
  b.querySelector('.d').textContent = g.desc;
  b.addEventListener('click', () => startGame(g));
  gamesEl.appendChild(b);
});

function bindSeg(id, key) {
  const el = $(id);
  const paint = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === settings[key]));
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings[key] = b.dataset.v; store.set(key, settings[key]); paint(); updateCamBtn();
  });
  paint();
}
bindSeg('#sens', 'sens'); bindSeg('#mode', 'mode');

function updateCamBtn() {
  $('#camBtn').classList.toggle('hidden', touchMode() || camReady);
  if (touchMode()) setStatus('👆 터치 모드: 게임 중에 자기 쪽 화면을 톡톡 눌러요.');
  else if (camReady) setStatus('📷 카메라 준비 완료! 두 사람이 다 보이면 게임을 골라요.');
  else setStatus('');
}
$('#camBtn').addEventListener('click', async () => { audio(); if (await startCamera()) updateCamBtn(); });

for (const [id, k] of [['#n1', 0], ['#n2', 1]]) {
  const el = $(id);
  el.value = store.get('name' + k, el.value);
  el.addEventListener('change', () => store.set('name' + k, el.value.trim()));
}
$('#againBtn').addEventListener('click', () => startGame(game));
$('#menuBtn').addEventListener('click', toMenu);
$('#quit').addEventListener('click', toMenu);
updateCamBtn();

// 테스트용 훅 (개발자 도구에서 사용)
window.__mg = { players, processPoses, startCamera, get phase() { return phase; }, get game() { return game; } };
</script>
</body>
</html>
